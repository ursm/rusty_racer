# Run the test suite on every push to main and every PR — the fast feedback loop
# cibuildgem.yaml (tag-only) doesn't give. Every platform links Deno's STOCK
# prebuilt rusty_v8, which the v8 crate downloads (the `simdutf` feature picks the
# _simdutf variant); since rusty_v8 150.1.0 the linux archive is shared-library-
# safe, so no custom archive is needed. Mirrors cibuildgem's compile+test, minus
# packaging/publish.
name: "test"
on:
  push:
    branches: ["main"]
  pull_request:

# A new push to a branch/PR cancels its still-running test run.
concurrency:
  group: "test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "test (${{ matrix.os }}, ruby ${{ matrix.ruby }})"
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-22.04-arm", "macos-latest", "macos-26-intel"]
        ruby: ["3.3", "3.4", "4.0"]
    runs-on: "${{ matrix.os }}"
    # Capture the rare watchdog "leaked terminate" anomaly (a next op spuriously
    # ScriptTerminated) if it ever recurs here — prints [rusty watchdog ANOMALY]
    # with the watchdog state + timing. Off in production; on in CI only.
    env:
      RUSTY_RACER_WATCHDOG_DEBUG: "1"
    steps:
      - uses: "actions/checkout@v6"
      - uses: "dtolnay/rust-toolchain@stable"
      - uses: "ruby/setup-ruby@v1"
        with:
          ruby-version: "${{ matrix.ruby }}"
          bundler-cache: true
      - name: "Compile + test"
        run: "bundle exec rake test"
