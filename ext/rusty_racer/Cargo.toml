# Standalone (detached from the spike workspace) so it builds as a normal gem
# extension. The cdylib is the Ruby extension; V8 is baked in — the v8 crate
# downloads Deno's stock prebuilt rusty_v8 archive and links it statically. Since
# rusty_v8 150.1.0 that archive is shared-library-safe on linux too, so the .so
# links and loads with no custom archive.
[package]
name = "rusty_racer"
version = "0.2.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# rb-sys: exposes magnus::rb_sys (protect — catch a Ruby raise from a host
# callback so it can't longjmp through V8 — and the raw VALUE conversions used
# to root the owner thread).
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = "0.9"
# rusty_v8's String conversion (to_rust_string_lossy etc.) — the path every
# V8->Ruby string crosses — transcodes UTF-16 with simdutf, worth ~6-8x on
# non-ASCII results (measured; ASCII is unaffected). Since 152.0.0 that is baked
# into every prebuilt archive, so the `simdutf` feature we used to pass is a
# deprecated no-op and is gone from here.
v8 = "152.2.0"
# pthread stack-bounds query, to set V8's stack limit per op relative to the
# current native thread (in-thread V8 runs on the Ruby thread's stack).
libc = "0.2"
